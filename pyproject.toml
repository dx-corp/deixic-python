[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deixic-sdk"
version = "0.1.5"
description = "Python SDK for submitting Deixic tasks, following progress, and resolving approvals"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE"]
dependencies = [
  "protobuf>=7.35.0,<8",
  "requests>=2.32.4,<3",
]

[project.optional-dependencies]
test = [
  "build>=1,<2",
  "pytest>=8,<10",
  "twine>=6,<8",
]

[project.urls]
Homepage = "https://www.deixic.com/developers"
Repository = "https://github.com/dx-corp/deixic-python"
Issues = "https://github.com/dx-corp/deixic-python/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deixic = ["py.typed"]
